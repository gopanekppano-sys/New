<!DOCTYPE html>
<html lang="en">
    <head>
        <title>AdvancedSearch</title>
    </head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        form div{text-align:left;
        padding: 5px;}
        #link{text-align:right;font-size:20px;}
        #grid form{display:grid; grid-template-columns: 200px auto; grid-column-gap: 5px; grid-row-gap: 5px;}
        .size{font-size: 20px;font-family: arial;}
        input[type=text]{border-radius: 5px;width:500px;height:35px;font-size: 20px;}
        input[type=submit]{border-radius: 5px;width:150px;height:35px;color:white;background-color:blue;font-size: 15px;}
        #grid{margin:20px;padding:20px;}
        @media screen and (max-width: 600px) {
            #grid form{display:grid; grid-template-columns: 100px auto; grid-column-gap: 5px; grid-row-gap: 5px;}
            input[type=text]{width:300px;height:35px;font-size: 20px;}
        }
        @media screen and (max-width: 599px) {
            #grid form{display:grid; grid-template-columns: 100px auto; grid-column-gap: 5px; grid-row-gap: 5px;}
            input[type=text]{width:300px;height:35px;font-size: 20px;}
        }
        #style{color:blue;font-size:18px;margin-left:45px;}
        #underline{border-bottom: 1px solid #ccc; margin-bottom: 20px;}
    </style>
    <body>
        <div id="link"><a href="index.html"> Google Search</a></div>
        <div id="style"><h2>Google</h2></div>
        <div id="underline"></div>
        <div style="margin-left:45px;"><h2>Advanced Search</h2></div>
        <div style="margin-left:45px;"><h4>Find pages with...</h4></div>
    
        <div id="grid"><form action="https://www.google.com/advanced_search">
            <div class="size">All of the words:</div>
           <div> <input type="text" name="as_q" ></div>
           <div class="size">Exact phrase:</div>
            <div><input type="text" name="as_epq"></div>
            <div class="size">Any of the words:</div>
            <div><input type="text" name="as_oq" ></div>
            <div class="size">None of the words:</div>
            <div><input type="text" name="as_eq"></div>
            <div></div>
            <div><input type="submit" value="Advanced Search"></div>
        </form>
    </div>
       
    </body>
</html>
